# APD Community Worker. Deployed by CI with Chris's Cloudflare API token (a GitHub secret), never from a laptop key.
name = "apd-community"
main = "src/app.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "apd-community"
database_id = "SET-AFTER-CREATING-THE-D1-DATABASE"
migrations_dir = "migrations"

[vars]
ADMIN_EMAILS = ""   # Chris's email goes here

# Verification-code emails (Cloudflare Email Service). Needs the Workers Paid plan and the sending domain onboarded
# (npx wrangler email sending enable charltonbornstudios.com). Until then sign-up answers "email_not_set_up".
# [[send_email]]
# name = "EMAIL"
