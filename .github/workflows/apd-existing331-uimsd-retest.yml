name: Retest exact TEST331 unchanged UIMSD opening budget
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-existing331-uimsd-retest.yml]
permissions:
  contents: read
  actions: read
jobs:
  exact-uimsd-api34:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '21'}
    - uses: gradle/actions/setup-gradle@v4
    - name: Download exact produced APK and prove unchanged application inputs
      env: {GH_TOKEN: "${{ github.token }}"}
      run: |
        python3 - <<'PY'
        import hashlib,json,os,pathlib,subprocess,sys,zipfile
        sys.path.insert(0,'tools')
        from apd_existing_build_evidence import application_inputs
        repo=os.environ['GITHUB_REPOSITORY'];source='168e49778c18dd6a2c82bea48aa41028d513f60a';run_id=40929924852
        api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
        assert api('repos/'+repo)['private']
        trees=[api(f'repos/{repo}/git/trees/{s}?recursive=1') for s in (source,os.environ['GITHUB_SHA'])]
        assert all(not t.get('truncated') for t in trees)
        assert application_inputs(trees[0]['tree'])==application_inputs(trees[1]['tree'])
        run=api(f'repos/{repo}/actions/runs/{run_id}');assert run['head_sha']==source
        assert any(j['name']=='verify-and-build' and j['conclusion']=='success' for j in api(f'repos/{repo}/actions/runs/{run_id}/jobs')['jobs'])
        a,=[a for a in api(f'repos/{repo}/actions/runs/{run_id}/artifacts')['artifacts'] if a['name']=='apd-codex-private-test-apk' and not a['expired']]
        with open('exact331.zip','wb') as out:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{a["id"]}/zip'],stdout=out,check=True)
        assert 'sha256:'+hashlib.sha256(pathlib.Path('exact331.zip').read_bytes()).hexdigest()==a['digest']
        pathlib.Path('application').mkdir()
        with zipfile.ZipFile('exact331.zip') as z:
            apk,=[n for n in z.namelist() if n.endswith('.apk')]
            data=z.read(apk);digest=hashlib.sha256(data).hexdigest()
            checksum,=[n for n in z.namelist() if n.endswith('.apk.sha256')]
            assert z.read(checksum).decode().split()[0]==digest
            pathlib.Path('application/exact331.apk').write_bytes(data)
        print('EXACT_TEST331_APK_SHA256',digest)
        pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':run_id,'application_sha256':digest,'protected_application_inputs_identical':True,'application_rebuilt':False,'test_source':os.environ['GITHUB_SHA'],'prior_failed_job':123646794271,'prior_failure':'Original full Android run passed64of65; opening1 measured322ms against250ms. First isolated retry mistakenly used1080x2400 Pixel7/software instead of original320x640/160dpi/default SwiftShader and measured1006ms. Restore the original benchmark display and renderer; same method, source, APK and250ms limit'},indent=2))
        PY
    - name: Restore established APD signer from encrypted secrets
      uses: ./.github/actions/apd-signing
      with:
        keystore-base64: ${{ secrets.APD_SIGNING_KEYSTORE_BASE64 }}
        store-password: ${{ secrets.APD_SIGNING_STORE_PASSWORD }}
        key-password: ${{ secrets.APD_SIGNING_KEY_PASSWORD }}
        key-alias: ${{ secrets.APD_SIGNING_KEY_ALIAS }}
    - name: Compile instrumentation only
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
        ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C331
        test ! -f android/build/outputs/apk/debug/android-debug.apk
        ./gradlew --stop
        python3 -m pip install pillow
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Exercise unchanged250ms opening benchmark on exact APK
      env: {APD_ENFORCE_DISPLAY: 'true'}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: default
        emulator-boot-timeout: 300
        disable-animations: true
        script: adb shell wm size 320x640 && adb shell wm density 160 && adb shell wm size && adb shell wm density && bash tools/run-gathering331-uimsd-retest.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apd-existing331-uimsd-retest
        path: |
          acceptance-source.json
          uimsd-retest/
          uimsd-instrumentation.txt
          uimsd-logcat.txt
        retention-days: 7
    env:
      APD_SIGNING_STORE_PASSWORD: ${{ secrets.APD_SIGNING_STORE_PASSWORD }}
      APD_SIGNING_KEY_PASSWORD: ${{ secrets.APD_SIGNING_KEY_PASSWORD }}
      APD_SIGNING_KEY_ALIAS: ${{ secrets.APD_SIGNING_KEY_ALIAS }}
