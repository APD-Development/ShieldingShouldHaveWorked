name: APD lower-bound IN-filter checks
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-lower-bound-in-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: apd-lower-bound-in-acceptance
  cancel-in-progress: false
jobs:
  reproduce-and-check-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b5d562ca37fff9ac628af3f4ade731e9fa7d83f1
          path: original-application
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK for Gradle project configuration
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce lower-bound IN-filter failure in unchanged TEST241
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,xml.etree.ElementTree as E
          base=pathlib.Path('original-application')
          fixture=pathlib.Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/query/QueryEngineTest.java')
          (base/fixture).write_bytes(fixture.read_bytes())
          method='lowerBoundInFilterOnlyRejectsImpossibleCandidates'
          result=subprocess.run(['./gradlew',':core:test','--tests','com.shatteredpixel.shatteredpixeldungeon.apd.query.QueryEngineTest.'+method],cwd=base)
          roots=[E.parse(p).getroot() for p in (base/'core/build/test-results/test').glob('TEST-*.xml')]
          cases=[c for root in roots for c in root.iter('testcase')]
          failures={c.get('name') for c in cases if c.find('failure') is not None}
          assert len(cases)==1 and result.returncode!=0 and failures=={method},(len(cases),result.returncode,failures)
          pathlib.Path('original-lower-bound-in-result.json').write_text(json.dumps({'source':'b5d562ca37fff9ac628af3f4ade731e9fa7d83f1','tests':1,'expected_failures':sorted(failures),'original_production_changed':False},indent=2))
          PY
      - name: Run the complete corrected core suite
        run: |
          ./gradlew :core:test
          python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          cases=[c for root in roots for c in root.iter('testcase')]
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          method='lowerBoundInFilterOnlyRejectsImpossibleCandidates'
          names={c.get('name') for c in cases}
          assert totals['tests']==len(cases)==len({(c.get('classname'),c.get('name')) for c in cases})==1717,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0
          assert method in names
          pathlib.Path('corrected-lower-bound-in-result.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'counts':totals,'retained_methods':1,'application_built':False,'android_verified':False,'published':False},indent=2))
          PY
      - name: Retain original and corrected evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-lower-bound-in-before-after
          path: |
            original-lower-bound-in-result.json
            corrected-lower-bound-in-result.json
            original-application/core/build/test-results/test/
            core/build/test-results/test/
            core/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: warn
