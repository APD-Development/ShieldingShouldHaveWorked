name: Private test APK

# MANUAL ONLY. Builds the private test APK (all owner-approved test features on) and uploads it as a workflow artifact.
# It publishes no release, pushes nothing and runs no device tests. Run it only with the owner's explicit approval:
# one Linux job, roughly 3 to 5 billed minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build private test APK
        run: ./gradlew :android:assembleDebug -PapdTestBuild -PapdBuild=T${{ github.run_number }}
      - name: Name the APK
        run: cp android/build/outputs/apk/debug/android-debug.apk ADHD-Pixel-Dungeon-PRIVATE-TEST-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: private-test-apk
          path: ADHD-Pixel-Dungeon-PRIVATE-TEST-${{ github.run_number }}.apk
          retention-days: 7
