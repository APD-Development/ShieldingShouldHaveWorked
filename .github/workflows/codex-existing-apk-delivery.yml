name: Deliver verified existing APD TEST50

# Delivery only: reuse the already tested APK; no Gradle or app rebuild.
# Accept verified SDK signer labels; retain compatibility refusal diagnostics.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-existing-apk-delivery.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-existing-test50-delivery
  cancel-in-progress: false

env:
  APD_SOURCE_SHA: 14226785732470e5241daaabe92ba4dc7d399df3
  APD_SOURCE_RUN: '38151255573'
  APD_TEST_NUMBER: '50'
  APD_CORE_TEST_COUNT: '1089'
  APD_ANDROID_TEST_COUNT: '13'
  APD_ROLLBACK_NUMBER: '41'
  APD_ROLLBACK_SHA256: 'd476ca16cd3f17a6a13257812243696dd4ed0acb92f7a94192d528628766d188'
  APD_REQUIRED_ANDROID_METHODS: 'menusSurviveSceneRecreationAndNarrowActionsStayInsideTheirWindow,aRunCanBePlayedSavedContinuedAndEndedWithItsHistoryRecorded,aWonRunIsRecordedAsWonAndSealed,difficultyIsChosenOnTheCharacterScreenAndNotInSettings,communityMenuOpensEveryPreviewAndReturnsWithoutStackingWindows,adultHumorControlWorksWithoutAnAgeProviderAndReopensWithSavedChoice,textAndGuideScrollSurviveRepeatedResetsAndClampAfterResize,validationEmptyHistoryGroupedAndReportMessagesSurviveWithoutRepeatingActions,tourChoicesSurviveWithoutStartingATourOrRepeatingTheOffer,heroButtonsStayAboveNavigationBarAndRemainSelectable,navigationOverlapReservesVisibleBarsEvenWithFullscreenRequested,clericQuickCastsPersistAndKeepNormalCostsAndTargeting,arcanaItemDescriptionsRequireKnownEquippedRingsAndFitWindows'
  APD_SOURCE_ARTIFACTS_JSON: '{"apd-codex-android-checks":11706752278,"apd-codex-core-tests":11706293706,"apd-codex-private-test-apk":11706063940}'

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-private-test-apk
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-core-tests
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: core-reports
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-android-checks
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: android-reports
      - name: Retrieve rollback APK for direct compatibility comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apd-codex-test-41 --repo "$GITHUB_REPOSITORY" --pattern ADHD-Pixel-Dungeon-CODEX-TEST-41.apk --dir rollback
      - name: Check source, tests, checksum, signing and application ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tools -p test_apd_existing_build_evidence.py
          python3 tools/apd_existing_build_evidence.py
      - name: Count exact verified source for owner chat breakdown
        run: |
          git fetch --no-tags --depth=1 origin "$APD_SOURCE_SHA"
          python3 tools/apd_source_line_counts.py "$APD_SOURCE_SHA" delivery
      - name: Produce today's report from verified evidence
        run: |
          python3 -m pip install reportlab==4.2.5
          python3 -m unittest discover -s tools -p test_apd_bug_report_pdf.py
          python3 tools/apd_bug_report_pdf.py docs/APD-TEST50-REPORT-2026-10-11.md delivery/APD-Bug-Fixes-2026-10-11-TEST50.pdf --verification delivery/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-test50-delivery
          path: delivery/
          retention-days: 7

# Private staging only; retain separate 11:55 PDF / 11:59 APK delivery times.
# Refresh factual staging evidence; do not assert a release tag or missed deadline before publication.
