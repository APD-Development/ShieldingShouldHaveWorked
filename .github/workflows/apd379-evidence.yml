name: Inspect379 retained native test results without rebuilding
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-379-EVIDENCE-REQUEST.txt]
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: apd379-native-Developer, run-id: 42526945257, github-token: '${{ github.token }}', path: evidence}
      - uses: actions/download-artifact@v4
        with: {name: apd379-native-Alpha-Testers, run-id: 42526945257, github-token: '${{ github.token }}', path: evidence}
      - name: Report exact retained item-window failures
        run: |
          cat evidence/developer-qol.txt
          cat evidence/alpha-qol.txt
