name: APD Community server deploy
# Deploys server/community to Cloudflare after its tests pass. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets (Chris adds them) and the real D1 database id in wrangler.toml.
# Without the secrets it stops after the tests and says so. Run by hand only: nothing deploys by itself.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check deploy settings
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet: tests passed, nothing deployed."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q "SET-AFTER-CREATING" wrangler.toml; then echo "wrangler.toml still has no D1 database id: nothing deployed."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        if: steps.ready.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply apd-community --remote
      - name: Deploy
        if: steps.ready.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
