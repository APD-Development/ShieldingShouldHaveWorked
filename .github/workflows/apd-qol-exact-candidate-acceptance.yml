name: APD exact candidate mechanics and waiting touch acceptance
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-QOL-EXACT-CANDIDATE.json]
permissions: {contents: read, actions: read}
concurrency:
  group: apd-qol-exact-candidate
  cancel-in-progress: false
jobs:
  native-qol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse the exact candidate without another application build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,time,zipfile
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import application_inputs
          spec=json.load(open('docs/APD-QOL-EXACT-CANDIDATE.json'))
          repo=os.environ['GITHUB_REPOSITORY'];source=spec['source'];run=spec['run']
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          produced=api(f'repos/{repo}/actions/runs/{run}')
          assert produced['head_sha']==source and produced['run_number']==spec['build']
          trees=[api(f'repos/{repo}/git/trees/{sha}?recursive=1') for sha in (source,os.environ['GITHUB_SHA'])]
          assert all(not tree.get('truncated') for tree in trees)
          assert application_inputs(trees[0]['tree'])==application_inputs(trees[1]['tree'])
          deadline=time.monotonic()+600
          while True:
              jobs=api(f'repos/{repo}/actions/runs/{run}/jobs')['jobs']
              producer,=[job for job in jobs if job['name']=='verify-and-build']
              if producer['conclusion']=='success':break
              assert producer['status']!='completed','Application producer failed: '+str(producer['conclusion'])
              assert time.monotonic()<deadline,'Timed out waiting for the exact application artifact'
              time.sleep(20)
          artifacts=api(f'repos/{repo}/actions/runs/{run}/artifacts')['artifacts']
          artifact,=[item for item in artifacts if item['name']=='apd-codex-private-test-apk' and not item['expired']]
          with open('candidate.zip','wb') as out:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'],stdout=out,check=True)
          assert 'sha256:'+hashlib.sha256(pathlib.Path('candidate.zip').read_bytes()).hexdigest()==artifact['digest']
          pathlib.Path('application').mkdir()
          with zipfile.ZipFile('candidate.zip') as archive:archive.extractall('application')
          apk,=pathlib.Path('application').glob('*.apk');sidecar,=pathlib.Path('application').glob('*.apk.sha256')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest();assert sidecar.read_text().split()[0]==digest
          pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':run,'application_sha256':digest,'application_rebuilt':False,'application_inputs_unchanged':True,'test_source':os.environ['GITHUB_SHA'],'physical_phone_tested':False},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('APD_BUILD='+str(spec['build'])+'\n')
          PY
      - name: Compile instrumentation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild "-PapdBuild=C$APD_BUILD"
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          ./gradlew --stop
          python3 -m pip install pillow
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real pointer checks for mechanics panels and independent waiting controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r "application/ADHD-Pixel-Dungeon-CODEX-TEST-$APD_BUILD.apk"
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb logcat -c
            timeout 600 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest,com.shatteredpixel.shatteredpixeldungeon.android.ApdSettingsClickDeviceTest#remainingApdSettingsControlsRespondToActualTouches,com.shatteredpixel.shatteredpixeldungeon.android.ApdSettingsClickDeviceTest#everyDeclaredSettingControlHasAnExplicitAcceptanceOwner' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > qol-instrumentation.txt 2>&1
            adb logcat -d -v time > qol-logcat.txt
            cat qol-instrumentation.txt
            python3 -c "import pathlib,re; text=pathlib.Path('qol-instrumentation.txt').read_text(); assert re.search(r'OK \(3 tests\)',text); assert not any(marker in text for marker in ['FAILURES!!!','INSTRUMENTATION_FAILED','Process crashed.'])"
            mkdir -p qol-visuals
            for name in qol-mechanics-buff-expanded.png qol-mechanics-talent-expanded.png qol-mechanics-ability-expanded.png qol-mechanics-spell-expanded.png qol-waiting-independent-stops.png qol-waiting-saved-stops.png; do adb exec-out cat "/sdcard/Pictures/APD-Test-Visuals/$name" > "qol-visuals/$name"; done
            python3 tools/validate_android_visuals.py qol-visuals qol-mechanics-buff-expanded.png qol-mechanics-talent-expanded.png qol-mechanics-ability-expanded.png qol-mechanics-spell-expanded.png qol-waiting-independent-stops.png qol-waiting-saved-stops.png
      - name: Preserve actual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-qol-exact-candidate-acceptance
          path: |
            acceptance-source.json
            qol-instrumentation.txt
            qol-logcat.txt
            qol-visuals/
          retention-days: 14
