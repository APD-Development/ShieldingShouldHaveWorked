name: Get Fucked isolated feasibility scenarios

on:
  push:
    branches: [codex/get-fucked-feasibility-tests]

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Inventory health writes and death calls across actual production source
        run: python3 .github/scripts/get_fucked_source_audit.py
      - name: Export the existing engine test runtime for local fixed-command experiments
        run: ./gradlew :core:exportGetFuckedTestRuntime
      - uses: actions/upload-artifact@v4
        with:
          name: get-fucked-existing-engine-runtime
          path: core/build/get-fucked-runtime/
          retention-days: 7
      - name: Replay continuous cold escape, cave travel shortcut and legitimately mastered sword
        run: |
          mkdir -p "$RUNNER_TEMP/get-fucked-shortcut"
          tar -xJf research/get-fucked/cold-exit-shortcut-provenance.tar.xz -C "$RUNNER_TEMP/get-fucked-shortcut"
          python3 - <<'PYCODE'
          import json, os, subprocess
          root=os.environ['RUNNER_TEMP']+'/get-fucked-shortcut'
          args=json.load(open(root+'/manual-fourteen-shortcut-args.json'))
          props={a[2:].split('=',1)[0]:a.split('=',1)[1] for a in args if a.startswith('-D') and '=' in a}
          props.pop('route.expectedMissileIdEquivalence',None)
          props.update({'route.testTimeoutSeconds':'600','route.stableHash':'true','route.noSnapshots':'true','route.manualReplay':root+'/manual-fourteen-shortcut-complete.journal','route.manualContinue':'false','route.manualJournal':root+'/actual-shortcut-replay.journal','route.expectedEnd':root+'/native/manual-fourteen-shortcut-end-manual-6117','route.expectedActiveRngOnly':'true','route.earlySwarmOut':root+'/actual-fresh-shortcut'})
          subprocess.run(['./gradlew',':core:test','--tests','*GetFuckedRouteTest']+['-D'+k+'='+v for k,v in props.items()],check=True)
          subprocess.run(['python3','research/get-fucked/native_equivalence.py',props['route.expectedEnd'],props['route.earlySwarmOut']],check=True)
          PYCODE
      - name: Replay continuous level-one Cleric through actual Shaman bypass and magical-fire approach
