name: Get Fucked isolated feasibility scenarios

on:
  push:
    branches: [codex/get-fucked-feasibility-tests]

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run scenario and existing challenge tests
        run: ./gradlew :core:test --tests '*GetFuckedFeasibilityTest' --tests '*GetFuckedTest' --tests '*ShieldHungerTest'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-feasibility-results
          path: core/build/test-results/test/
