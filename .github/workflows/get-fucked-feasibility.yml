name: Get Fucked isolated feasibility scenarios

on:
  push:
    branches: [codex/get-fucked-feasibility-tests]

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Inventory health writes and death calls across actual production source
        run: python3 .github/scripts/get_fucked_source_audit.py
      - name: Export the existing engine test runtime for local fixed-command experiments
        run: ./gradlew :core:exportGetFuckedTestRuntime
      - uses: actions/upload-artifact@v4
        with:
          name: get-fucked-existing-engine-runtime
          path: core/build/get-fucked-runtime/
          retention-days: 7
      - name: Run scenario and existing challenge tests
        run: ./gradlew :core:test --tests '*GetFuckedFeasibilityTest' --tests '*GetFuckedTest' --tests '*ShieldHungerTest' --tests '*GetFuckedMapTest' --tests '*GetFuckedBarrierDecayTest'
      - name: Preserve baseline test reports before the route task
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-baseline-results
          path: core/build/test-results/test/
      - name: Replay corrected level-one origin through actual floor-three entry
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.certifyPrefix=true -Droute.stopAfterFloor3=true -Droute.expectedActiveRngOnly=true
          -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor3_certified_origin"
      - name: Preserve corrected level-one origin replay
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-certified-origin-results
          path: core/build/test-results/test/
      - name: Replay the earned floor-three state through floor-four entry
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor3"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.stopAfterFloor4=true
      - name: Preserve floor-three continuation results
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-floor3-route-results
          path: core/build/test-results/test/
      - name: Replay floor four through earned Goo-floor entry
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor4"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.retainFlame=true -Droute.toGoo=true
      - name: Preserve floor-four continuation results
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-floor4-route-results
          path: core/build/test-results/test/
      - name: Return from earned floor five and acquire barricade supplies
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor5"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.gooPrep=200 -Droute.returnToFour=true
      - name: Preserve acquired barricade supplies replay
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-barricade-route-results
          path: core/build/test-results/test/
      - name: Defeat pursuing crab and acquire purity from retained resources
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor4_return_complete"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.stopAtPurity=true
      - name: Preserve purity acquisition replay
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-purity-route-results
          path: core/build/test-results/test/
      - name: Replay actual Ghost quest and safe food recovery
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor4_purity_complete"
          -Droute.stableHash=true -Droute.noSnapshots=true
          -Droute.killSlimeBeforeTrap=true -Droute.skipSlimeShield=true
      - name: Preserve Ghost quest replay
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-ghost-route-results
          path: core/build/test-results/test/
      - name: Replay meal reward armor upgrade and existing Goo floor return
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor4_food_complete"
          -Droute.stableHash=true -Droute.noSnapshots=true
      - name: Preserve earned armor replay
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-armor-route-results
          path: core/build/test-results/test/
      - name: Defeat Goo with the earned armor and continuous resources
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor5_armored_complete"
          -Droute.stableHash=true -Droute.noSnapshots=true
          -Droute.armoredGoo=true -Droute.gooHolyWeapon=true -Droute.assertGooDefeated=true
      - name: Preserve earned Goo victory replay
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-goo-victory-results
          path: core/build/test-results/test/
      - name: Replay post-Goo recovery recharge and native prison entry
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_goo_defeated"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.postGoo=true
      - name: Replay prison shop purchase and meal
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor6"
          -Droute.stableHash=true -Droute.noSnapshots=true
      - name: Replay trap disarm strength room and first skeleton
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor6_food"
          -Droute.stableHash=true -Droute.noSnapshots=true
      - name: Replay second skeleton and earned armor upgrade
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor6_strength"
          -Droute.stableHash=true -Droute.noSnapshots=true
      - name: Continue through floor-six swarm food and retained enemies
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor6_upgraded"
          -Droute.stableHash=true -Droute.noSnapshots=true 
      - name: Continue floor six through actual floor-seven entry
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor6_northfood"
          -Droute.stableHash=true -Droute.noSnapshots=true 
      - name: Pay for floor-seven entrance recharge with the recovered ration
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor7"
          -Droute.stableHash=true -Droute.noSnapshots=true 
      - name: Defeat actual floor-seven skeletons and acquire the next ration
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor7_rested"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.sevenContinue=true
      - name: Intercept returning thief before Rage is lost
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor7_food"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.interceptThief=true
      - name: Check the real guard chain pull and lethal negative control
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor7_intercept"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.guardPullAudit=true
      - name: Use retained Rage to escape through actual floor-eight entry
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor7_intercept"
          -Droute.stableHash=true -Droute.noSnapshots=true 
      - name: Pay actual floor-eight preparation cost
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor8"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.eightWait=150
          -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor8_rested150"
      - name: Earn level seven Bless and acquire the fourth strength potion
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor8_rested150"
          -Droute.stableHash=true -Droute.noSnapshots=true -Droute.eightContinue=true
          -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor8_bless"
      - name: Defeat guard and both DMs and acquire actual food with continuous resources
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor8_bless"
          -Droute.stableHash=true -Droute.noSnapshots=true
          -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor8_pasty"
      - name: Fall legally acquire and equip Hourglass and escape actual crystal exit
        run: |
          ./gradlew :core:test --tests '*GetFuckedRouteTest' \
            -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor7_intercept" \
            -Droute.stableHash=true -Droute.noSnapshots=true -Droute.hourglassAccess=true \
            -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_exit"
          mkdir -p "$RUNNER_TEMP/get-fucked-hourglass/pit"
          cp core/build/test-results/test/TEST-*.xml "$RUNNER_TEMP/get-fucked-hourglass/pit/"
      - name: Pay four Hourglass charges to bypass the living northern guard
        run: |
          ./gradlew :core:test --tests '*GetFuckedRouteTest' \
            -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_exit" \
            -Droute.stableHash=true -Droute.noSnapshots=true  \
            -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_northpool"
          mkdir -p "$RUNNER_TEMP/get-fucked-hourglass/bypass"
          cp core/build/test-results/test/TEST-*.xml "$RUNNER_TEMP/get-fucked-hourglass/bypass/"
      - name: Continue to central pool door with pursuing guard and actual charges
        run: |
          ./gradlew :core:test --tests '*GetFuckedRouteTest' \
            -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_northpool" \
            -Droute.stableHash=true -Droute.noSnapshots=true  \
            -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_central"
          mkdir -p "$RUNNER_TEMP/get-fucked-hourglass/central"
          cp core/build/test-results/test/TEST-*.xml "$RUNNER_TEMP/get-fucked-hourglass/central/"
      - name: Read retained Rage at the actual central room doorway
        run: |
          ./gradlew :core:test --tests '*GetFuckedRouteTest' \
            -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_central" \
            -Droute.stableHash=true -Droute.noSnapshots=true -Droute.hourglassRageAtDoor=true \
            -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_door"
          mkdir -p "$RUNNER_TEMP/get-fucked-hourglass/door"
          cp core/build/test-results/test/TEST-*.xml "$RUNNER_TEMP/get-fucked-hourglass/door/"
      - name: Replay exact interrupted movement and retain central enemies
        run: |
          ./gradlew :core:test --tests '*GetFuckedRouteTest' \
            -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_door" \
            -Droute.stableHash=true -Droute.noSnapshots=true  \
            -Droute.expectedEnd="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_duel"
          mkdir -p "$RUNNER_TEMP/get-fucked-hourglass/duel"
          cp core/build/test-results/test/TEST-*.xml "$RUNNER_TEMP/get-fucked-hourglass/duel/"
      - name: Verify attacking ends Time Freeze and the guard really kills the hero
        run: |
          ./gradlew :core:test --tests '*GetFuckedRouteTest' \
            -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_hourglass_exit" \
            -Droute.stableHash=true -Droute.noSnapshots=true -Droute.hourglassAttack=true
          mkdir -p "$RUNNER_TEMP/get-fucked-hourglass/negative"
          cp core/build/test-results/test/TEST-*.xml "$RUNNER_TEMP/get-fucked-hourglass/negative/"
      - name: Preserve native Hourglass branch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-hourglass-route-results
          path: ${{ runner.temp }}/get-fucked-hourglass/
      - name: Replay earned Goo approach and first ranged retreat
        run: >-
          ./gradlew :core:test --tests '*GetFuckedRouteTest'
          -Droute.resume="$GITHUB_WORKSPACE/core/src/test/resources/apd/get_fucked_seed266_floor5"
          -Droute.stableHash=true -Droute.noSnapshots=true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-feasibility-results
          path: core/build/test-results/test/
      - name: Print bounded scenario observations
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml'):
              r=ET.parse(p).getroot()
              print(p.name, r.attrib)
              for e in r.findall('system-out'):
                  print(e.text or '')
          PY

      - name: Preserve research provenance for mechanical review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-research-provenance
          path: research/get-fucked/
          retention-days: 90
