name: APD Rat King route sight reuse source regression
on:
  push:
    branches: [chatgpt/apd-rat-quicksearch-sight-reuse-20261116-2300]
    paths:
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/RatKingQuickSearch.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/RatKingRoomAndSearchTest.java
      - .github/workflows/apd-rat-quicksearch-sight-ci-20261116.yml
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fully approved source ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6fa033167789ef9f2fc6f31bcff39c824dfb4db HEAD
          git merge-base --is-ancestor 5c4d2a30bb75ccd1e6e7e8905fab9f9d06432693 HEAD
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Full core tests and desktop/Android Java compilation; no APK build
        run: ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Assert original and new quote regressions passed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites,'missing junit'
          counts={k:sum(int(s.get(k,'0')) for s in suites) for k in ('tests','failures','errors','skipped')}
          tests={(s.get('name'),t.get('name')) for s in suites for t in s.findall('testcase')}
          target='com.shatteredpixel.shatteredpixeldungeon.apd.qol.RatKingRoomAndSearchTest'
          assert (target,'reusedQuickSearchSightExactlyMatchesFreshCastsIncludingWardenGrass') in tests
          assert (target,'swiftnessEnemyProximityMatchesForwardRuleAcrossWallsAndEnemyStates') in tests
          assert counts['tests']>=3546 and counts['failures']==counts['errors']==counts['skipped']==0,counts
          counts['suites']=len(suites)
          print(counts)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-rat-quicksearch-sight-junit
          path: core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
