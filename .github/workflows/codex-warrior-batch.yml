name: APD 100-seed normal Warrior experiment

on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-warrior-batch.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-normal-warrior-batch-${{ github.sha }}
  cancel-in-progress: false

env:
  APD_SIMULATION_SOURCE: 99a4a39200c98cc457c61c8f2ed8e06d74befb84
  APD_BASELINE_RUN: '38087065433'

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require actual passing native verification before installing anything
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "$APD_BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh run view "$APD_BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > baseline.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path('baseline.json').read_text())
          if run['headSha']!=os.environ['APD_SIMULATION_SOURCE'] or run['conclusion']!='success':
              raise SystemExit('Baseline/source verification failed; do not run a batch from this candidate.')
          PY

  run-seeds:
    needs: verify-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 99a4a39200c98cc457c61c8f2ed8e06d74befb84
      - uses: actions/download-artifact@v4
        with:
          name: apd-reusable-warrior-simulator
          path: simulator-binaries
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38087065433
      - name: Reuse the five verified episodes and play only the 95 remaining seeds
        env:
          APD_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import os
          baseline={1000007,1000035,1000042,1000060,1000089}
          first=1000000+20*int(os.environ['APD_SHARD_INDEX'])
          seeds=[n for n in range(first,first+20) if n not in baseline]
          assert len(seeds)==19
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('APD_SIMULATION_COUNT=19\n')
              output.write(f'APD_SIMULATION_SEED={first}\n')
              output.write('APD_SIMULATION_SEEDS='+','.join(map(str,seeds))+'\n')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play actual normal-profile episodes without recompiling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: true
          script: bash tools/run-warrior-instrumentation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-warrior-shard-${{ matrix.shard }}
          path: |
            simulation-results.jsonl
            simulation-instrumentation.txt
            simulator-logcat.txt
            simulator-binaries/manifest.json
          retention-days: 7

  collect-baseline:
    needs: verify-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apd-real-warrior-simulation
          path: baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38087065433
      - uses: actions/upload-artifact@v4
        with:
          name: apd-warrior-baseline
          path: baseline/
          if-no-files-found: error
          retention-days: 7

  summarize:
    if: always() && needs.verify-baseline.result == 'success'
    needs: [verify-baseline, run-seeds, collect-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 99a4a39200c98cc457c61c8f2ed8e06d74befb84
      - uses: actions/download-artifact@v4
        with:
          pattern: apd-warrior-*
          path: evidence
      - name: Preserve every attempt and reject an incomplete 100-seed result
        run: python3 tools/summarize-warrior-experiment.py evidence --allowed-source "$APD_SIMULATION_SOURCE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-100-normal-warrior-results
          path: |
            simulation-summary.json
            simulation-summary.attempts.jsonl
          retention-days: 7
