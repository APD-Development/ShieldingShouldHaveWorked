name: APD 100-seed real Warrior experiment

on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-warrior-batch.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-warrior-batch
  cancel-in-progress: true

jobs:
  run-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: apd-reusable-warrior-simulator
          path: simulator-binaries
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38082044233
      - name: Select disjoint seed range
        env:
          APD_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          echo "APD_SIMULATION_COUNT=20" >> "$GITHUB_ENV"
          echo "APD_SIMULATION_SEED=$((1000000 + 20 * APD_SHARD_INDEX))" >> "$GITHUB_ENV"
          echo "APD_SIMULATION_SOURCE=0a827d398330356512e90b8ea347bea6939dd209" >> "$GITHUB_ENV"
      - name: Verify simulator evidence and delivery guards
        run: |
          python3 tools/test-warrior-trace-recovery.py
          python3 tools/test-warrior-instrumentation.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play 20 actual early-game episodes without rebuilding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/run-warrior-instrumentation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-warrior-shard-${{ matrix.shard }}
          path: |
            simulation-results.jsonl
            simulation-instrumentation.txt
            simulator-logcat.txt
            simulator-binaries/manifest.json
          retention-days: 7

  summarize:
    if: always()
    needs: run-seeds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apd-warrior-shard-*
          path: evidence
      - name: Report actual records without inventing absent runs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('evidence').rglob('simulation-results.jsonl'))
          rows = [json.loads(line) for file in files for line in file.read_text().splitlines() if line.strip()]
          seeds = [r['seed'] for r in rows]
          if len(seeds) != len(set(seeds)): raise SystemExit('Duplicate seed evidence')
          expected = set(range(1000000, 1000100))
          if set(seeds) - expected: raise SystemExit('Unexpected seed evidence')
          complete = [r for r in rows if r['completed'] is True]
          summary = {
              'requested': 100, 'executed': len(rows), 'completedEpisodes': len(complete),
              'missingSeeds': sorted(expected - set(seeds)),
              'incomplete': [r for r in rows if r['completed'] is not True],
              'observedHealingBeforeNormalFlyHealing': sum(r['observedHealingBeforeNormalFlyHealing'] for r in complete),
              'normalFlyHealingObserved': sum(r['normalFlyHealingObserved'] for r in complete),
              'deathEpisodes': sum(r['stopReason'] == 'death' for r in complete),
              'summedEpisodeElapsedMillis': sum(r['elapsedMillis'] for r in rows),
              'interpretation': 'Early-game bot episodes only; healing use is not proof it prevented death. No population balance conclusion.'
          }
          Path('simulation-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          Path('simulation-all-results.jsonl').write_text(''.join(json.dumps(r) + '\n' for r in sorted(rows, key=lambda r:r['seed'])))
          print({k:v for k,v in summary.items() if k != 'incomplete'})
          if len(complete) != 100: raise SystemExit('Requested batch is incomplete; evidence retained, no 100-success claim')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-100-warrior-results
          path: |
            simulation-summary.json
            simulation-all-results.jsonl
          retention-days: 7
