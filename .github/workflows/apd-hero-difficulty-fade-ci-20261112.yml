name: Verify APD character difficulty fade
on:
  push:
    branches: [chatgpt/apd-hero-difficulty-fade-20261112]
    paths: [.github/workflows/apd-hero-difficulty-fade-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify difficulty fade and pointer handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java').read_text()
          bar=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/ui/DifficultyBar.java').read_text()
          fade=scene.split('private void updateFade(){',1)[1].split('private void resetFade(){',1)[0]
          assert 'difficultyBar.active = difficultyBar.visible && alpha != 0;' in fade
          assert 'difficultyBar.fade(alpha);' in fade
          method=bar.split('public void fade(float alpha){',1)[1].split('protected void layout(){',1)[0]
          for expected in ('label.enable(enabled);','label.alpha(alpha);','segment.enable(enabled);','segment.alpha(alpha);'):
              assert expected in method,expected
          assert 'boolean enabled = alpha > 0f' in method
          print('Difficulty label and five segment controls follow existing fade and stop taking input at zero alpha')
          PY
      - name: Complete core suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean complete core suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing core JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3300 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          print('Verified',totals,'across',len(reports),'suites')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-hero-difficulty-fade-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
