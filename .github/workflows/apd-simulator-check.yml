name: APD Simulator check (emulator)

#Builds the APD Simulator app, installs it on an Android emulator, lets it play, and prints what happened (runs, bug reports,
#screenshots as base64) into the job log. Never publishes anything. Simulator branch only.
on:
  push:
    branches: [feature/apd-simulator]
    paths: ['simulator/**', '.github/workflows/apd-simulator-check.yml']
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long the simulator plays on the emulator'
        default: '6'

permissions:
  contents: read

#a newer push replaces an older check that is still running
concurrency:
  group: apd-simulator-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the simulator app and the simulator's tests
        run: ./gradlew :simulator:android:assembleDebug :simulator:core:test --no-daemon
      - name: Play on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MINUTES: ${{ github.event.inputs.minutes || '6' }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: false
          script: bash .github/ci/apd-simulator-emulator.sh
