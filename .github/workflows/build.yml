name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :core:test
      - name: Build debug APK
        run: ./gradlew :android:assembleDebug
      - name: Rename APK
        run: cp android/build/outputs/apk/debug/android-debug.apk ADHD-Pixel-Dungeon-4.0.8-apd-${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apd-build-${{ github.run_number }}
          name: ADHD Pixel Dungeon 4.0.8-apd (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: ADHD-Pixel-Dungeon-4.0.8-apd-${{ github.run_number }}.apk
