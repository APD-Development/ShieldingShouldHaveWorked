name: Verify APD malformed-terrain wall search safety
on:
  push:
    branches: [codex/apd-search-invalid-terrain-20261112]
    paths: [.github/workflows/apd-invalid-terrain-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require observed terrain range guard and hidden-map regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol')
          source=(root/'DoorSearchEligibility.java').read_text()
          passage=source.split('private static boolean passage(',1)[1].split('public static boolean couldHaveDoor(',1)[0]
          assert 'if(!known(l,p))return true;' in passage
          assert 'if(t<0||t>=Terrain.flags.length)return false;' in passage
          assert passage.index('if(!known(l,p))return true;')<passage.index('int t=l.map[p];')
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/DoorSearchEligibilityTest.java').read_text()
          assert 'unsupportedObservedBackingTilesFailClosedWithoutLeakingUnknownTerrain' in test
          print('Observed malformed terrain fails closed; unseen terrain is not inspected.')
          PY
      - name: Run full APD core JUnit and compile desktop and Android variants
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require all core suites and malformed terrain regression to pass
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots,'Missing core XML results'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3267,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          matches=[r for r in roots if r.get('name','').endswith('.DoorSearchEligibilityTest')]
          assert len(matches)==1
          cases=[c.get('name') for c in matches[0].findall('testcase')]
          assert cases.count('unsupportedObservedBackingTilesFailClosedWithoutLeakingUnknownTerrain')==1,cases
          print('Verified',totals,'across',len(roots),'core suites')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-observed-malformed-terrain-source-verification
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
