name: APD missing run-start archive privacy exact source gate

on:
  push:
    branches: [chatgpt/apd-missing-run-start-archive-privacy-20261113-0339]
    paths:
      - .github/workflows/apd-archive-missing-start-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveMissingRunStartPrivacyTest.java
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: apd-missing-run-start-privacy-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm exact source guard and new tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveMissingRunStartPrivacyTest.java').read_text()
          assert 'if (started && r.sealed && r.status.isClean()' in code
          for name in ('sealedEndWithoutTypedRunStartCannotExposeHiddenFacts',
                       'malformedRunStartCannotProveCompletion',
                       'validTypedRunStartRetainsLosslessCompletedExport'):
              assert 'void ' + name + '(' in tests, name
          PY
      - name: Full core JUnit plus desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Validate complete JUnit XML and new regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          counts = {k:sum(int(x.get(k, 0)) for x in reports) for k in ('tests','failures','errors','skipped')}
          assert counts['tests'] >= 3409, counts
          assert all(counts[k] == 0 for k in ('failures','errors','skipped')), counts
          cases = {case.get('name') for report in reports for case in report.findall('testcase')}
          for name in ('sealedEndWithoutTypedRunStartCannotExposeHiddenFacts',
                       'malformedRunStartCannotProveCompletion',
                       'validTypedRunStartRetainsLosslessCompletedExport'):
              assert name in cases, name
          print('Full core JUnit:', counts, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-missing-run-start-privacy-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
