name: APD FullPackSwap stale capacity exact-source CI
on:
  push:
    branches: [chatgpt/apd-fullpackswap-stale-room-20261116-2100]
    paths:
      - .github/workflows/apd-fullpackswap-stale-room-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/FullPackSwap.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/FullPackSwapSelectionTest.java
permissions: {contents: read}
concurrency:
  group: apd-fullpackswap-stale-room-20261116
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm exact approved source ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6fa033167789ef9f2fc6f31bcff39c824dfb4db HEAD
          git merge-base --is-ancestor c11cb3aaefea4811064c10fa85bfd4fa26006e8a HEAD
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/FullPackSwap.java').read_text()
          assert '|| !applies(hero, heap, item)' in src
          assert 'return needsSwap(hero.belongings.backpack, item);' in src
          PY
      - name: Run full core suite and compile desktop plus Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Verify full-suite and focused regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites, 'Missing test reports'
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3541, totals
          assert totals['failures']==totals['errors']==totals['skipped']==0, totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          assert 'newlyFreedBackpackSlotMakesAStaleSwapUnnecessary' in names
          assert 'previouslySelectableItemThatLosesDropActionIsRefused' in names
          assert 'requiredR7ClassesCannotDisappearFromACombinedBuild' in names
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-fullpackswap-stale-capacity-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
