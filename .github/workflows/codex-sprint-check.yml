name: Codex APD sprint verification

#Owner authorized this sprint and all development actions on 2026-10-09.
#This trigger is confined to the Codex work branch and an explicit build request.
#It never runs for ordinary code/doc commits, main, or other developers' branches.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - .github/workflows/codex-sprint-check.yml
      - docs/APD-CODEX-BUILD-REQUEST.txt

permissions:
  contents: read

concurrency:
  group: codex-apd-sprint-verification
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the complete core unit test suite
        run: ./gradlew :core:test
      - name: Build the private debug APK
        run: ./gradlew :android:assembleDebug -PapdTestBuild -PapdBuild=C${{ github.run_number }}
      - name: Name and hash the APK
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk ADHD-Pixel-Dungeon-CODEX-TEST-${{ github.run_number }}.apk
          sha256sum ADHD-Pixel-Dungeon-CODEX-TEST-${{ github.run_number }}.apk > ADHD-Pixel-Dungeon-CODEX-TEST-${{ github.run_number }}.apk.sha256
      - name: Keep the APK as a private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apd-codex-private-test-apk
          path: |
            ADHD-Pixel-Dungeon-CODEX-TEST-${{ github.run_number }}.apk
            ADHD-Pixel-Dungeon-CODEX-TEST-${{ github.run_number }}.apk.sha256
          retention-days: 7
      - name: Keep the unit-test report even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-codex-core-tests
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
