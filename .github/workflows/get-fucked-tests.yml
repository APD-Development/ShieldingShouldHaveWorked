name: Get Fucked challenge checks

on:
  push:
    branches: [codex/get-fucked-challenge]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core regression tests
        run: ./gradlew :core:test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-fucked-test-reports
          path: core/build/test-results/test/
