name: Qualify APD461 malformed terrain safety APKs on Android
on:
  push:
    branches: [codex/apd-search-invalid-terrain-20261112]
    paths:
      - .github/workflows/apd-candidate461-native.yml
      - tools/apd461_native_postcheck.py
permissions: {contents: read, actions: read}
concurrency: {group: apd461-native-candidate, cancel-in-progress: false}
jobs:
  android-native:
    strategy:
      fail-fast: false
      matrix:
        variant: [Developer, Alpha-Testers]
        case: [WallGeometryDeviceTest, SearchContextDeviceTest, SeedHistoryDeviceTest]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Require exact completed source-bound candidate, never rebuild
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          expected='d9ed33ffe582b2d88994c844eb865c634178d85e'
          for retry in range(150):
              run=json.loads(subprocess.check_output(['gh','api','repos/APD-Development/ShieldingShouldHaveWorked/actions/runs/43240620452']))
              assert run['head_sha']==expected,'Unexpected APD461 producer source'
              if run['status']=='completed':
                  assert run['conclusion']=='success','Frozen APD461 producer not successful'
                  break
              time.sleep(10)
          else: raise RuntimeError('APD461 candidate still not built')
          PY
          mkdir -p candidate461
          gh run download 43240620452 --repo "$GITHUB_REPOSITORY" --name apd461-unaccepted-gated-room-candidate --dir candidate461
          python3 - <<'PY'
          import pathlib,hashlib,json
          folder=pathlib.Path('candidate461')
          receipt=json.loads((folder/'receipt.json').read_text())
          assert receipt['source']=='8e3b8dc1aaab311c8c142b0f475b037a37bc6eeb'
          assert receipt['build']==461 and receipt['native_accepted'] is False
          for kind,entry in receipt['files'].items():
              name='APD-Instrumentation-461.apk' if kind=='Instrumentation' else f'APD-{kind}-461.apk'
              f=folder/name
              assert f.stat().st_size==entry['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==entry['sha256']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise existing wall, search and seed Android cases without rebuilding game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p native461
            adb install -r candidate461/APD-${{ matrix.variant }}-461.apk
            adb install -r candidate461/APD-Instrumentation-461.apk
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.${{ matrix.case }}' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native461/instrumentation.txt 2>&1
            cat native461/instrumentation.txt
            python3 tools/apd461_native_postcheck.py --variant '${{ matrix.variant }}' --case '${{ matrix.case }}' --directory native461
            adb logcat -d -v time > native461/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd461-native-${{ matrix.variant }}-${{ matrix.case }}
          path: native461/
          if-no-files-found: warn
          retention-days: 30
