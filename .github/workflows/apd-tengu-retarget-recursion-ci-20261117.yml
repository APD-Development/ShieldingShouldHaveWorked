name: APD Tengu retarget recursion safety
on:
  push:
    branches: [chatgpt/apd-tengu-retarget-recursion-20261117-0700]
    paths:
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Tengu.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/TenguUnreachableRetargetVisibilityTest.java
      - .github/workflows/apd-tengu-retarget-recursion-ci-20261117.yml
  pull_request:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Tengu.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/TenguUnreachableRetargetVisibilityTest.java
      - .github/workflows/apd-tengu-retarget-recursion-ci-20261117.yml
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete R7 plus C485 lineage and earlier Tengu repair
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6fa033167789ef9f2fc6f31bcff39c824dfb4db HEAD
          git merge-base --is-ancestor 9fa34d192cc4608bed3f418dca0f927a97122e31 HEAD
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android Java compilation platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Full core tests and desktop plus Android Java compilation
        run: ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Verify existing Tengu regressions and recursion guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites, 'missing full core JUnit results'
          counts = {k: sum(int(s.get(k,'0')) for s in suites) for k in ('tests','failures','errors','skipped')}
          cases = {(s.get('name'), t.get('name')) for s in suites for t in s.findall('testcase')}
          suite = 'com.shatteredpixel.shatteredpixeldungeon.actors.mobs.TenguUnreachableRetargetVisibilityTest'
          required = {
              'visibleReplacementIsAttackableAfterUnseenOldTarget',
              'unseenReplacementDoesNotInheritOldTargetVisibility',
              'invisibleReplacementCannotAttackUsingOldTargetVisibility',
              'deadReplacementCannotAttackUsingOldTargetVisibility',
              'alternatingUnreachableTargetsOnlyRetryOnce',
          }
          assert required.issubset({name for suite_name, name in cases if suite_name == suite}), 'missing Tengu regression'
          assert counts['tests'] >= 3569, counts
          assert counts['failures'] == counts['errors'] == counts['skipped'] == 0, counts
          print('APD_TENGU_RECURSION_JUNIT', dict(counts, suites=len(suites)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-tengu-retarget-recursion-junit
          path: core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
