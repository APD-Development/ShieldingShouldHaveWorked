name: Deliver existing TEST329 owner diagnostic candidate
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-owner-diagnostic329-release.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: apd-owner-diagnostic329-publication
  cancel-in-progress: false
jobs:
  private-owner-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install report rendering dependencies
        run: python3 -m pip install reportlab==4.2.5 Pillow==11.3.0
      - name: Verify exact artifacts and publish with unresolved timing failure clearly disclosed
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 tools/apd_publish_owner_diagnostic329.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-owner-diagnostic329-publication
          path: |
            owner-delivery/publication.json
            owner-delivery/release-notes.txt
            owner-delivery/APD-Alpha-Preview-329.pdf
            owner-delivery/APD-329-Verification.json
          if-no-files-found: warn
