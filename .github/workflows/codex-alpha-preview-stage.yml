name: Stage verified APD alpha preview candidate

# Delivery only: reuse the already tested APK; no Gradle or app rebuild.
# Accept verified SDK signer labels; retain compatibility refusal diagnostics.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-alpha-preview-stage.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-alpha-preview-stage
  cancel-in-progress: false

env:
  APD_SOURCE_SHA: 3e886234e69ab128a861cfbc17bca549ba3a3456
  APD_SOURCE_RUN: '38823705331'
  APD_TEST_NUMBER: '224'
  APD_CORE_TEST_COUNT: '1676'
  APD_ANDROID_TEST_COUNT: '32'
  APD_ROLLBACK_NUMBER: '222'
  APD_ROLLBACK_SHA256: 'c4fe922f32c7b07f94666ae01591a04384fa5c801afcb4f869aca9a5c0e6aea5'
  APD_REQUIRED_ANDROID_METHODS: 'menusSurviveSceneRecreationAndNarrowActionsStayInsideTheirWindow,validationEmptyHistoryGroupedAndReportMessagesSurviveWithoutRepeatingActions,arcanaItemDescriptionsRequireKnownEquippedRingsAndFitWindows,textAndGuideScrollSurviveRepeatedResetsAndClampAfterResize,tourChoicesSurviveWithoutStartingATourOrRepeatingTheOffer,demoUnlockKeepsTenRunNoticeVisibleOnTitle,backWalksBackwardsOneStepPerPress,aRunCanBePlayedSavedContinuedAndEndedWithItsHistoryRecorded,tileVisibilityAndStairNavigationKeepNormalTurnsFogAndControls,aWonRunIsRecordedAsWonAndSealed,clericQuickCastsPersistAndKeepNormalCostsAndTargeting,difficultyIsChosenOnTheCharacterScreenAndNotInSettings,heroButtonsStayAboveNavigationBarAndRemainSelectable,clericLoreFirstRunPopupIsVisibleAndBackContinuesExactlyOnce,navigationOverlapReservesVisibleBarsEvenWithFullscreenRequested,communityMenuOpensEveryPreviewAndReturnsWithoutStackingWindows,adultHumorControlWorksWithoutAnAgeProviderAndReopensWithSavedChoice,offlineNewsCardsOpenDatedSpritePopups,everyAboutPopupOpensScrollsAndCloses,aboutFoundingStatementAndPopupFollowAdultHumorOnEveryOpening,everyUimsdScreenAndDialogCanBeBuilt,replacingHomeContentsDisposesPreviouslyDrawnImages,categoriesUseSpdColumnsAndEveryIconOpensItsExactBuildPopup,largeAndNamedHistoricalBuildsKeepAllIconsInScrollableNativeSections,noticeStaysAboveUsableControlsAndDoesNotChangeLockedRunOrScores,equipmentControlAcceptsTouchAndSavesOnlyNextRunPreferences,touchscreenSliderGesturesLockDirectionAndPreserveDraftAndSavedRules,allEighteenControlsAcceptNativeTouchSaveAndReopenWithoutChangingActiveRun,healingConversionSettingExplainsItsExactScopeWithoutChangingSavedValue,androidTopScoresOpensOriginalRankingsAndBackPreservesStoredHistory,nativeScorePopupsShowRecordedNeutralPendingAndUnknownThenCloseWithAndroidBack,playerReleaseNotesAreCompactBrandedAndEveryChangeOpens'

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e886234e69ab128a861cfbc17bca549ba3a3456
      - uses: actions/checkout@v4
        with:
          path: lunch-preparation
      - name: Wait for exact TEST224 verification and resolve actual artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          repo=os.environ['GITHUB_REPOSITORY']
          run=os.environ['APD_SOURCE_RUN']
          deadline=time.monotonic()+1800
          while True:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
              assert data['head_sha']==os.environ['APD_SOURCE_SHA']
              if data['status']=='completed':
                  assert data['conclusion']=='success', 'Source verification failed: no publication'
                  break
              if time.monotonic()>=deadline:
                  raise SystemExit('Source verification still pending: no publication')
              time.sleep(20)
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))['artifacts']
          names=('apd-codex-core-tests','apd-codex-private-test-apk','apd-codex-android-checks')
          result={}
          for name in names:
              matches=[a for a in data if a['name']==name and not a['expired']]
              assert len(matches)==1
              result[name]=matches[0]['id']
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('APD_SOURCE_ARTIFACTS_JSON='+json.dumps(result)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-private-test-apk
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-core-tests
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: core-reports
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-android-checks
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: android-reports
      - name: Retrieve rollback APK for direct compatibility comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apd-codex-test-222 --repo "$GITHUB_REPOSITORY" --pattern ADHD-Pixel-Dungeon-CODEX-TEST-222.apk --dir rollback
      - name: Check source, tests, checksum, signing and application ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tools -p test_apd_existing_build_evidence.py
          python3 tools/apd_existing_build_evidence.py
      - name: Verify the delivered APK enables the owner's Cleric lore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apks=list(Path('delivery').glob('*.apk'))
          assert len(apks)==1
          with zipfile.ZipFile(apks[0]) as z:
              flags=set(z.read('assets/apd/features.txt').decode('utf-8').splitlines())
          assert {'testBuild','grudge','clericPlayable'}.issubset(flags)
          print('Actual delivered APK explicitly enables private Cleric lore and Cleric play.')
          PY
      - name: Stage the forty verified Android screenshots
        run: |
          mkdir -p delivery/screenshots
          cp android-reports/codex-visual-evidence/*.png delivery/screenshots/
          test "$(find delivery/screenshots -name '*.png' | wc -l)" -eq 40
          sha256sum delivery/screenshots/*.png > delivery/Android-Screenshot-Checksums.sha256
      - name: Archive verified source and reference file inventory
        run: |
          git fetch --no-tags --depth=1 origin "$APD_SOURCE_SHA"
          python3 tools/apd_source_line_counts.py "$APD_SOURCE_SHA" delivery
          git archive --format=zip --output=delivery/APD-Verified-Source.zip "$APD_SOURCE_SHA" SPD-classes/src/main/java core/src/main/java core/src/test/java android/src/main/java android/src/androidTest/java core/src/main/assets/apd/releases core/src/main/assets/apd/history docs/APD-NEXT-BUILD-HISTORY.json tools/apd_build_history.py
          sha256sum delivery/APD-Verified-Source.zip > delivery/APD-Verified-Source.zip.sha256
      - name: Produce today's report from verified evidence
        run: |
          python3 -m pip install reportlab==4.2.5
          python3 -m unittest discover -s tools -p test_apd_bug_report_pdf.py
          cat lunch-preparation/docs/APD-CLEAN-LANGUAGE-LOCALIZATION-2026-10-15.md lunch-preparation/docs/APD-EARLY-ALPHA-ACCEPTANCE-2026-10-16.md > delivery/acceptance-appendices.md
          python3 tools/apd_bug_report_pdf.py lunch-preparation/docs/APD-PLAYER-RELEASE-NOTES-2026-10-15.md delivery/APD-Alpha-Preview-224.pdf --verification delivery/verification.txt --appendix delivery/acceptance-appendices.md
      - uses: actions/upload-artifact@v4
        with:
          name: staged-alpha-preview224
          path: delivery/
          retention-days: 7

# Private alpha preparation reuses exact verified artifacts; no automatic tester distribution.
# Separate daily lunch schedules are unchanged. No app rebuild or publication in this staging workflow.

      - uses: actions/upload-artifact@v4
        with:
          name: staged-alpha-preview224-evidence
          path: |
            delivery/*.json
            delivery/*.txt
            delivery/*.pdf
            delivery/*.csv
            delivery/*.md
            delivery/*.sha256
            delivery/screenshots/
            delivery/APD-Verified-Source.zip
          retention-days: 7

