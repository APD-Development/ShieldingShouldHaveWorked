name: Verify APD463 integrated animation and current source
# Rerun after fixing all renamed monster-playback test helper call sites.
on:
  push:
    branches: [chatgpt/apd463-character-animations-integrated-20261112]
    paths: [.github/workflows/apd-character-animation-speed-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate character animation only and preserved 1x world
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java').read_text()
          character=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/CharSprite.java').read_text()
          hero=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/HeroSprite.java').read_text()
          mob=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/MobSprite.java').read_text()
          playback=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/PlaybackGroup.java').read_text()
          assert 'mobs = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene
          assert 'emoicons = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene
          assert 'gases = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene
          assert scene.count('PlaybackGroup.normalSpeedGroup()')>=18
          assert 'Game.elapsed = PlaybackGroup.characterAnimationElapsed();' in character
          assert 'Game.elapsed = elapsed;' in character
          assert 'PlaybackGroup.movementDuration(moveInterval)' in character
          assert 'protected synchronized void updateAnimation()' not in hero
          assert 'protected synchronized void updateAnimation()' not in mob
          assert 'return Game.elapsed * speed;' in playback
          print('Only character frames scale; APD462 movement and all 1x visual layers remain intact')
          PY
      - name: Run all core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify regression cases and all passing JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'No test reports'
          totals={k:sum(int(x.get(k,0)) for x in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3320 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={t.get('name') for suite in reports for t in suite.findall('testcase')}
          for case in ('realCharacterSpriteFramesUseSelectedSpeedWhileRestoringGlobalElapsed','heroAndEnemySpriteFramesFollowAllTenSpeedsWithoutChangingSceneElapsed','persistentDungeonOverlaysKeepNormalSpeedAtEveryPlaybackSetting','onlyMovementDurationFollowsAllTenSpeedSelections','fourXAcceleratesMonsterStandingAndActionFrames','allOriginalSpeedsScaleMonsterIdleAndActionTiming'):
              assert case in cases,case
          print(totals,'suites',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-character-animation-core-tests
          path: core/build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
