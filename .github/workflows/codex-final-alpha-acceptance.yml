name: Additional exact-APK early-alpha acceptance on TEST253
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-final-alpha-acceptance.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: apd-final-alpha-acceptance253
  cancel-in-progress: false
jobs:
  reuse-and-check:
    strategy:
      fail-fast: false
      matrix:
        api: [34,36]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APD_ACCEPTANCE_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse the exact verified application and retain only supplemental tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];source='6d9162f5946311728b1723a3b02d688072a8da79'
          run_id=38943900747;artifact_id=12064716016;expected=None
          def api(path):return json.loads(subprocess.check_output(['gh','api',path]))
          assert api('repos/'+repo)['private']
          run=api(f'repos/{repo}/actions/runs/{run_id}')
          assert run['head_sha']==source
          jobs=api(f'repos/{repo}/actions/runs/{run_id}/jobs')['jobs']
          assert any(j['name']=='verify-and-build' and j['conclusion']=='success' for j in jobs), 'APK producer/core/history has not succeeded'
          # Other OS acceptance may run in parallel. Publication separately requires
          # the whole primary workflow, staging and both supplemental jobs to pass.
          metadata=api(f'repos/{repo}/actions/artifacts/{artifact_id}')
          assert metadata['workflow_run']['head_sha']==source and not metadata['expired']
          assert metadata['digest']=='sha256:64b401770227301b71b85e8a06947b54bd5177b49698b136be648963e29dabc0'
          paths=['android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/CustomScoreDeviceTest.java','android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/PlayRunDeviceTest.java','core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/difficulty/BossProgressionAcceptanceTest.java','android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/EarlyAlphaRosterDeviceTest.java']
          supplemental={path:pathlib.Path(path).read_bytes() for path in paths}
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',source],check=True)
          protected=['core/src/main','SPD-classes/src/main','services/src/main','android/src/main','android/build.gradle','core/build.gradle','SPD-classes/build.gradle','services/build.gradle','build.gradle','settings.gradle','gradle.properties','gradle']
          differences=subprocess.check_output(['git','diff','--name-only',source,'HEAD','--']+protected,text=True)
          assert not differences.strip(),'Test-only wrapper changed application inputs'
          subprocess.run(['git','checkout','--detach',source],check=True)
          for path,content in supplemental.items():pathlib.Path(path).parent.mkdir(parents=True,exist_ok=True);pathlib.Path(path).write_bytes(content)
          subprocess.run(['git','diff','--exit-code',source,'--']+protected,check=True)
          with open('verified-test253.zip','wb') as target:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],stdout=target,check=True)
          assert hashlib.sha256(pathlib.Path('verified-test253.zip').read_bytes()).hexdigest()==metadata['digest'].removeprefix('sha256:')
          with zipfile.ZipFile('verified-test253.zip') as z:
              names=[n for n in z.namelist() if n.endswith('.apk')];assert len(names)==1;apk=z.read(names[0])
              expected=z.read(names[0]+'.sha256').decode().split()[0]
              assert len(expected)==64 and all(c in '0123456789abcdef' for c in expected)
          assert hashlib.sha256(apk).hexdigest()==expected
          pathlib.Path('verified-test253.apk').write_bytes(apk)
          pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':run_id,'application_artifact':artifact_id,'application_sha256':expected,'supplemental_test_commit':os.environ['GITHUB_SHA'],'api_level':int(os.environ['APD_ACCEPTANCE_API']),'application_rebuilt':False,'application_reused':True,'protected_application_inputs_identical':True,'physical_device':False,'tester_distribution':False},indent=2))
          PY
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile instrumentation only; do not assemble another application APK
        run: |
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C253
          test ! -f android/build/outputs/apk/debug/android-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set explicit test scope for each Android version
        run: |
          python3 - <<'PY'
          import os
          p='com.shatteredpixel.shatteredpixeldungeon.android.'
          api=int(os.environ['APD_ACCEPTANCE_API'])
          methods=[p+'EarlyAlphaRosterDeviceTest#allSixClassesStartSaveAndContinueWithLockedExtremeRules'] if api==34 else [
              p+'CustomRulesNoticeDeviceTest#allEighteenControlsAcceptNativeTouchSaveAndReopenWithoutChangingActiveRun',
              p+'CustomRulesNoticeDeviceTest#scoringVisionPopupOpensScrollsAndBackPreservesDraftOnSmallScreens',
              p+'CustomScoreDeviceTest#dailyCalendarShowsFrozenLongEarnedScoreWithoutOverlappingDates',
              p+'PlayRunDeviceTest#aRunCanBePlayedSavedContinuedAndEndedWithItsHistoryRecorded',
              p+'UimsdRestoreDeviceTest#menusSurviveSceneRecreationAndNarrowActionsStayInsideTheirWindow',
              p+'CustomRulesNoticeDeviceTest#touchscreenSliderGesturesLockDirectionAndPreserveDraftAndSavedRules',
              p+'CustomScoreDeviceTest#nativeScorePopupsShowRecordedNeutralPendingAndUnknownThenCloseWithAndroidBack',
              p+'CustomRulesNoticeDeviceTest#liveMultipliersMatchEveryPositionAndUpdateDuringNativeDragBeforeRelease']
          images=['alpha-roster-'+name+'.png' for name in ['warrior','mage','rogue','huntress','duelist','cleric']] if api==34 else [
              'hotbar-controls.png','custom-scoring-vision.png','custom-scoring-vision-narrow.png','daily-earned-score.png','daily-earned-score-scrolled.png','custom-rules-touch-gestures.png','custom-score-neutral.png','custom-score-pending.png','custom-score-unknown.png','custom-score-narrow-before.png','custom-score-narrow.png','custom-rules-live-drag.png','custom-rules-live-summary.png']
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('APD_DEVICE_METHODS='+','.join(methods)+'\n')
              target.write('APD_EXPECTED_METHODS='+str(len(methods))+'\n')
          import json,pathlib
          pathlib.Path('expected-screenshots.json').write_text(json.dumps(images))
          pathlib.Path('run-isolated-acceptance.py').write_text("import os,pathlib,subprocess\noutputs=[]\nfor method in os.environ['APD_DEVICE_METHODS'].split(','):\n    subprocess.run(['adb','shell','am','force-stop','com.charltonchris29.adhdpixeldungeon.indev'],check=True)\n    result=subprocess.run(['timeout','300','adb','shell','am','instrument','-w','-r','-e','class',method,'com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)\n    outputs.append('METHOD '+method+'\\n'+result.stdout)\n    pathlib.Path('instrumentation.txt').write_text('\\n'.join(outputs))\n")
          PY
      - name: Free unused runner toolchains for the Android 16 userdata partition
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage('/home/runner').free
          print('Free bytes before emulator system-image setup:',free)
          assert free>=10*1024**3,'Insufficient disposable-runner space; do not wait for a doomed emulator boot'
          PY
      - name: Exercise the reused APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 36 && 'google_apis' || 'default' }}
          disable-animations: true
          script: |
            test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = "1"
            adb install -r verified-test253.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            if [ "$APD_ACCEPTANCE_API" = "36" ]; then adb shell wm size 540x960; adb shell wm density 240; else adb shell wm size 320x640; adb shell wm density 160; fi
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            python3 run-isolated-acceptance.py
            adb logcat -d -v time > acceptance-logcat.txt
            mkdir -p acceptance-screenshots
            python3 -c "import json,pathlib,subprocess; [subprocess.run(['adb','pull','/sdcard/Pictures/APD-Test-Visuals/'+name,'acceptance-screenshots/'+name],check=True) for name in json.loads(pathlib.Path('expected-screenshots.json').read_text())]"
      - name: Validate actual instrumentation and screenshot evidence
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,struct,subprocess
          count=int(os.environ['APD_EXPECTED_METHODS']);api=int(os.environ['APD_ACCEPTANCE_API']);text=pathlib.Path('instrumentation.txt').read_text()
          print(text)
          assert len(re.findall(r'OK \(1 test\)',text))==count,text
          assert not any(s in text for s in ('FAILURES!!!','INSTRUMENTATION_FAILED','Process crashed.'))
          names=json.loads(pathlib.Path('expected-screenshots.json').read_text());images={}
          for name in names:
              p=pathlib.Path('acceptance-screenshots')/name;data=p.read_bytes();assert data[:8]==b'\x89PNG\r\n\x1a\n';width,height=struct.unpack('>II',data[16:24]);assert width>0 and height>0;images[name]=[width,height]
          assert len(images)==(6 if api==34 else 13)
          pathlib.Path('device-acceptance-result.json').write_text(json.dumps({'api_level':api,'instrumented_methods':count,'failures':0,'errors':0,'skipped':0,'application_reused':'TEST253','application_rebuilt':False,'physical_device':False,'images':images,'six_classes_save_continue':api==34,'android16_targeted_checks':api==36,'does_not_establish_complete_human_playthroughs':True},indent=2))
          PY
      - name: Retain successful and unsuccessful acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-final-alpha-api${{ matrix.api }}
          path: |
            acceptance-source.json
            headless-acceptance-result.json
            device-acceptance-result.json
            instrumentation.txt
            acceptance-logcat.txt
            acceptance-screenshots/
            core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
