name: Verify APD exact Search radius and full Android source
on:
  push:
    branches: [codex/apd-actual-search-radius-20261112]
    paths: [.github/workflows/apd-search-radius-verify-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Guard single authoritative Search radius and new regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol')
          session=(root/'WallSearchSession.java').read_text()
          chooser=(root/'SearchControlContext.java').read_text()
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContextTest.java').read_text()
          assert 'public static int searchRadius(Hero hero,boolean foresight)' in session
          assert 'int distance=searchRadius(hero,foresight);' in session
          assert 'int radius = WallSearchSession.searchRadius(hero, foresight);' in chooser
          assert 'boundedAdaptiveScanMatchesOriginalExhaustiveCoverageAcrossClasses' in test
          assert 'WallSearchSession.covers(hero, level, hero.pos, tile)' in test
          print('Exact footprint logic is shared and independently compared against exhaustive Search coverage.')
          PY
      - name: Run complete APD core tests and compile desktop and Android variants
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require all passing tests including exact radius regression
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots,'Missing JUnit XML results'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3266,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          matches=[r for r in roots if r.get('name','').endswith('.SearchControlContextTest')]
          assert len(matches)==1
          cases=[c.get('name') for c in matches[0].findall('testcase')]
          assert cases.count('boundedAdaptiveScanMatchesOriginalExhaustiveCoverageAcrossClasses')==1,cases
          print('Verified',totals,'across',len(roots),'core suites')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-search-radius-exact-source-verification
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
