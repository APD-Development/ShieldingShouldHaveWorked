name: APD R7 full-pack swap eligibility source verification
on:
  push:
    branches: [chatgpt/apd-r7-full-pack-swap-selection-20261116-1700]
    paths:
      - .github/workflows/apd-r7-fullpack-guard-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/FullPackSwap.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/FullPackSwapSelectionTest.java
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Verify both exact R7 and C485 ancestors
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6fa033167789ef9f2fc6f31bcff39c824dfb4db HEAD
          git merge-base --is-ancestor 34a1471ccd2f56ee21bb8c2579cb154ceb5e21c7 HEAD
      - name: Full core tests and Android plus desktop Java compile
        run: |
          set -o pipefail
          mkdir -p evidence
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon 2>&1 | tee evidence/build.log
      - name: Fail on any skipped or failed test and record counts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert paths, 'No JUnit result files'
          roots=[ET.parse(path).getroot() for path in paths]
          counts={n:sum(int(root.get(n,0)) for root in roots) for n in ('tests','failures','errors','skipped')}
          assert counts['tests'] >= 3542,counts
          assert counts['failures']==counts['errors']==counts['skipped']==0,counts
          matching=[path for path in paths if 'FullPackSwapSelectionTest' in path.name]
          assert len(matching)==1,matching
          testroot=ET.parse(matching[0]).getroot()
          assert int(testroot.get('tests'))==3,testroot.attrib
          Path('evidence/tests.json').write_text(json.dumps(counts,indent=2)+'\n')
          PY
      - name: Preserve exact source evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-head.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git diff c6fa033167789ef9f2fc6f31bcff39c824dfb4db HEAD -- core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/FullPackSwap.java > evidence/selection-diff.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APD-R7-FullPack-Selection-Source-Evidence
          path: |
            evidence/
            core/build/test-results/test/TEST-*FullPackSwapSelectionTest.xml
          retention-days: 14
          if-no-files-found: warn
