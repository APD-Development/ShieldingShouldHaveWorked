name: Publish verified APD461 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-search-invalid-terrain-20261112]
    paths: [.github/workflows/apd-publish461.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd461-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43240213617,'8e3b8dc1aaab311c8c142b0f475b037a37bc6eeb'),
            (43240620452,'d9ed33ffe582b2d88994c844eb865c634178d85e'),
            (43240714587,'b5024760c6f50a7ad64ebb8b216a7c0b5a73e3e6')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43240714587/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43240714587/artifacts?per_page=100']))['artifacts']
          expected={f'apd461-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-461 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD461 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43240620452 --repo "$GITHUB_REPOSITORY" --name apd461-unaccepted-gated-room-candidate --dir candidate461
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate461')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==461 and r['source']=='8e3b8dc1aaab311c8c142b0f475b037a37bc6eeb'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-461.apk' if kind=='Instrumentation' else f'APD-{kind}-461.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-461.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD461',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-461 candidate461/APD-Developer-461.apk candidate461/APD-Alpha-Testers-461.apk candidate461/APD-Source-461.zip \
            --repo "$GITHUB_REPOSITORY" --target 8e3b8dc1aaab311c8c142b0f475b037a37bc6eeb \
            --title 'APD461: safe malformed terrain wall search' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD461 source. Prevents crashes when a malformed observed terrain ID is examined as a wall-search passage. An added regression covers negative and out-of-range observed tiles in both approach directions, preserves unknown concealed terrain, and confirms unchanged valid-door eligibility. Search geometry, eligibility, turn costs, scoring and saves are unchanged. Previously approved adaptive Search and Copy Seed fixes are preserved. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-461 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate461/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-461.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-461.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate461/APD-Source-461.zip').read_bytes()).hexdigest()
          print('All three public APD461 release assets verified against frozen originals.')
          PY
