name: APD seed depth retroactive scoring regression
on:
  push:
    branches:
      - chatgpt/apd-seed-reuse-retroactive-depth-20261113
    paths:
      - .github/workflows/apd-seed-reuse-retroactive-depth-ci.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/recorder/SeedReuseScore.java
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Rankings.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/recorder/SeedReuseScoreTest.java
permissions:
  contents: read
jobs:
  scoring-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused real JUnit seeded ranking tests
        run: ./gradlew :core:test --tests 'com.shatteredpixel.shatteredpixeldungeon.apd.recorder.SeedReuseScoreTest' --no-daemon
      - name: Require exact scenario and migration test evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report=Path('core/build/test-results/test/TEST-com.shatteredpixel.shatteredpixeldungeon.apd.recorder.SeedReuseScoreTest.xml')
          assert report.exists(), 'Missing JUnit XML'
          root=ET.parse(report).getroot()
          print('Tests:',root.attrib)
          assert int(root.get('tests',0)) >= 10
          for key in ('failures','errors','skipped'): assert int(root.get(key,0)) == 0
          names={x.get('name') for x in root.findall('testcase')}
          for name in ('sevenEarlierAttemptsFloorNineToTwentySixRecoverActualRankingPoints','replayDeathsAndNewDepthProgression','oldZeroReceiptRetroactivelyUpgradesAndPersistsWithoutRecounting','forgedLegacyReceiptDoesNotMigrateOrOverwriteHistoricalScore'):
            assert name in names, name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-seed-depth-retroactive-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
