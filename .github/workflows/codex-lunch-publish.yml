name: Publish verified lunch TEST121 privately
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-lunch-publish.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: apd-lunch-test121-publication
  cancel-in-progress: false
jobs:
  private-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-test121-delivery
          run-id: 38422099618
          github-token: ${{ github.token }}
          path: delivery
      - name: Verify staged files and publish only to private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          repo=os.environ['GITHUB_REPOSITORY']
          assert api('repos/'+repo)['private'], 'Private repository required'
          now=datetime.now(ZoneInfo('America/New_York'))
          assert now.date().isoformat()=='2026-10-13' and (now.hour,now.minute)>=(11,59), 'No early publication'
          stage=api('repos/'+repo+'/actions/runs/38422099618')
          assert stage['head_sha']=='236bc96b20dba155bc498939991c0eddf6663211' and stage['conclusion']=='success'
          evidence=json.loads(Path('delivery/TEST121-Verification.json').read_text())
          assert evidence['source']=='010c44c877ef03dca7fe5ac2987cde309471d089'
          assert evidence['run']=='38410865529'
          for section,count in [('core',1370),('android',22)]:
              assert evidence[section]['tests']==count
              assert all(evidence[section][k]==0 for k in ['failures','errors','skipped'])
          apk=Path('delivery/ADHD-Pixel-Dungeon-CODEX-TEST-121.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest==evidence['apk_sha256']=='e00b07f93c887e9d8322ac70131068d1df7cafb5362f7bb42db6af8932a4c07a'
          assert Path(str(apk)+'.sha256').read_text().split()[0]==digest
          pdf=Path('delivery/APD-Bug-Fixes-2026-10-13-TEST121.pdf')
          assert hashlib.sha256(pdf.read_bytes()).hexdigest()=='91d16921cf5b34053ee2315d31abde9cd3eb809d79995f139bb0c0e99a805227'
          signer=sorted((Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          signature=subprocess.check_output([str(signer),'verify','--print-certs',str(apk)],text=True)
          cert='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          assert cert in signature and evidence['certificate_sha256']==[cert]
          package=subprocess.check_output([str(signer.parent/'aapt'),'dump','badging',str(apk)],text=True)
          assert "package: name='com.charltonchris29.adhdpixeldungeon.indev' versionCode='920' versionName='4.0.8-apd-INDEV-bC121-TEST'" in package
          tag='apd-codex-test-121'
          existing=subprocess.run(['gh','release','view',tag,'--repo',repo],capture_output=True)
          if existing.returncode==0:
              raise SystemExit('Existing release preserved; refusing asset overwrite')
          notes=Path('delivery/lunch-release-notes.txt')
          notes.write_text('Verified unchanged TEST121 lunch fallback. TEST122 failed three core checks and produced no APK; see the attached PDF. Source '+evidence['source']+'. 1370 core tests and 22 API34 emulator tests passed, no failures/errors/skips. APK checksum and signing compatibility verified. Physical-phone verification remains pending. Install over APD; never uninstall or clear data. No custom scoring coefficients or online activation. No APK rebuilt during delivery.')
          subprocess.run(['gh','release','create',tag,'--repo',repo,'--target',evidence['source'],'--prerelease','--latest=false','--title','APD PRIVATE CODEX TEST121 — lunch fallback','--notes-file',str(notes),str(apk),str(apk)+'.sha256',str(pdf),'delivery/TEST121-Verification.json'],check=True)
          print('Private release published; existing assets preserved.')
          PY
