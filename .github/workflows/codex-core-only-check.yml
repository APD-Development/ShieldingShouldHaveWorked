name: Codex APD core-only verification

# Test-only changes use this gate so an unchanged application is not rebuilt.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - .github/workflows/codex-core-only-check.yml
      - docs/APD-CODEX-CORE-TEST-REQUEST.txt

permissions:
  contents: read

concurrency:
  group: codex-apd-core-only-verification
  cancel-in-progress: false

jobs:
  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run complete core unit test suite
        run: ./gradlew :core:test
      - name: Summarize retained JUnit XML
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("core/build/test-results/test/TEST-*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          cases = []
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, "0"))
              if root.attrib.get("name", "").endswith("RunTurnWindowTest"):
                  cases = [case.attrib.get("name", "") for case in root.findall("testcase")]
          print("JUNIT_TOTALS suites={0} tests={tests} failures={failures} errors={errors} skipped={skipped}".format(len(files), **totals))
          print("RUN_TURN_WINDOW_CASES count={0} names={1}".format(len(cases), ",".join(sorted(cases))))
          if not files or totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit("JUnit evidence is absent or non-green")
          if len(cases) != 6:
              raise SystemExit("Expected all six RunTurnWindowTest methods")
          PY
      - name: Keep the unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-codex-core-only-tests
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
