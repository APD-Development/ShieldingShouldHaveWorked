name: APD Mob attackable target ordering regression
on:
  push:
    branches: [chatgpt/apd-attackable-target-order-20261117-0400]
    paths:
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/MobNearestTargetDistanceTest.java
      - .github/workflows/apd-mob-attackable-order-ci-20261117.yml
  pull_request:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/Mob.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/actors/mobs/MobNearestTargetDistanceTest.java
      - .github/workflows/apd-mob-attackable-order-ci-20261117.yml
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check combined baseline and previous AI fixes are ancestors
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6fa033167789ef9f2fc6f31bcff39c824dfb4db HEAD
          git merge-base --is-ancestor b4c345fb3f4760ba8513567616a61f6452619e83 HEAD
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compilation platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Full core tests and desktop plus Android Java compilation (source only)
        run: ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Verify target-selection regressions and complete passing JUnit suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites, 'missing core JUnit suite'
          counts = {key: sum(int(s.get(key, '0')) for s in suites) for key in ('tests','failures','errors','skipped')}
          cases = {(s.get('name'), case.get('name')) for s in suites for case in s.findall('testcase')}
          target = 'com.shatteredpixel.shatteredpixeldungeon.actors.mobs.MobNearestTargetDistanceTest'
          required = {
              'fartherAttackableTargetCannotReplaceANearerAttackableTarget',
              'equallyDistantAttackableHeroStaysPreferredAfterAMob',
              'otherAttackableTargetsRetainTheirExistingEqualDistanceTieOrder'
          }
          assert required.issubset({name for suite, name in cases if suite == target}), 'new target tests missing'
          assert counts['tests'] >= 3560, counts
          assert counts['failures'] == counts['errors'] == counts['skipped'] == 0, counts
          print('APD_ATTACKABLE_ORDER_JUNIT', dict(counts, suites=len(suites)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-mob-attackable-order-junit
          path: core/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
