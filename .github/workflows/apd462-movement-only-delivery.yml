name: APD462 movement-only verified APK delivery
on:
  push:
    branches: [chatgpt/apd-movement-only-playback-20261112]
    paths: [.github/workflows/apd462-movement-only-delivery.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd462-exact-candidate-and-delivery, cancel-in-progress: false}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Enforce owner movement-only rule and difficulty fade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java').read_text()
          sprite=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/sprites/CharSprite.java').read_text()
          group=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/PlaybackGroup.java').read_text()
          fade=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/HeroSelectScene.java').read_text()
          bar=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/ui/DifficultyBar.java').read_text()
          assert 'new com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup()' not in scene
          assert scene.count('com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup()') >= 18
          assert 'PlaybackGroup.movementDuration(moveInterval)' in sprite
          assert 'return normalDuration / speed;' in group
          assert 'difficultyBar.fade(alpha);' in fade
          assert 'public void fade(float alpha)' in bar
          assert 'difficultyBar.active = difficultyBar.visible && alpha != 0' in fade
          print('Walking accelerates; every scene visual layer and run difficulty selector stay at normal-time behavior')
          PY
      - name: Run complete core regression suite and compile Android and desktop Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean tests, movement-only and 1x overlay regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert r,'Missing test reports'
          totals={k:sum(int(x.get(k,0)) for x in r) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3307 and all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          names={c.get('name') for suite in r for c in suite.findall('testcase')}
          for case in ('onlyMovementDurationFollowsAllTenSpeedSelections','persistentDungeonOverlaysKeepNormalSpeedAtEveryPlaybackSetting'):
              assert case in names, case
          print('Core suite',totals,'suites',len(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd462-core-test-reports
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 30

  candidate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both unchanged-original-signer APK editions and instrumentation
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p candidate462
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C462
          cp android/build/outputs/apk/debug/android-debug.apk candidate462/APD-Developer-462.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk candidate462/APD-Instrumentation-462.apk
          ./gradlew :android:assembleDebug -PapdBuild=P462
          cp android/build/outputs/apk/debug/android-debug.apk candidate462/APD-Alpha-Testers-462.apk
          git archive --format=zip --output=candidate462/APD-Source-462.zip HEAD
      - name: Require original package signer and saved-game version compatibility
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          build=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools'
          tools=sorted(build.iterdir())[-1]
          while not (tools/'apksigner').exists(): tools=sorted(p for p in build.iterdir() if (p/'apksigner').exists())[-1];break
          expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          files={}
          for variant in ('Developer','Alpha-Testers'):
              f=pathlib.Path('candidate462')/('APD-'+variant+'-462.apk')
              assert f.stat().st_size>1000000
              sign=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(f)],text=True)
              digest=re.search(r'SHA-256 digest:\s*([0-9a-fA-F:]+)',sign).group(1).replace(':','').lower()
              assert digest==expected,(variant,digest)
              badge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(f)],text=True)
              pkg=next(line for line in badge.splitlines() if line.startswith('package:'))
              assert "name='com.charltonchris29.adhdpixeldungeon.indev'" in pkg,pkg
              assert "versionCode='920'" in pkg,pkg
              assert ('-bC462-TEST' if variant=='Developer' else '-bP462') in pkg,pkg
              files[variant]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size,'package':pkg}
          for name in ('APD-Instrumentation-462.apk','APD-Source-462.zip'):
              f=pathlib.Path('candidate462')/name
              assert f.stat().st_size>100000
              files[name]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size}
          receipt={'source':os.environ['GITHUB_SHA'],'build':462,'native_accepted':False,'published':False,'files':files}
          pathlib.Path('candidate462/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('Original signing certificate and both identities verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apd462-frozen-candidate
          path: candidate462/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        variant: [Developer, Alpha-Testers]
        case: [WallGeometryDeviceTest, SearchContextDeviceTest, SeedHistoryDeviceTest]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Obtain only original frozen candidate bytes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p candidate462
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name apd462-frozen-candidate --dir candidate462
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path('candidate462'); receipt=json.loads((d/'receipt.json').read_text())
          assert receipt['source']==os.environ['GITHUB_SHA'] and receipt['build']==462
          for key,info in receipt['files'].items():
              name='APD-'+key+'-462.apk' if key in ('Developer','Alpha-Testers') else key
              f=d/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact original Developer/Alpha APK on Android with native visual receipts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p native462
            adb install -r candidate462/APD-${{ matrix.variant }}-462.apk
            adb install -r candidate462/APD-Instrumentation-462.apk
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.${{ matrix.case }}' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native462/instrumentation.txt 2>&1
            cat native462/instrumentation.txt
            python3 tools/apd462_native_postcheck.py --variant '${{ matrix.variant }}' --case '${{ matrix.case }}' --directory native462 --source "$GITHUB_SHA"
            adb logcat -d -v time > native462/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd462-native-${{ matrix.variant }}-${{ matrix.case }}
          path: native462/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [source, candidate, native]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require exact six accepted native receipts from this build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -e
          mkdir -p candidate462 native-receipts
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name apd462-frozen-candidate --dir candidate462
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'apd462-native-*' --dir native-receipts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          source=os.environ['GITHUB_SHA']
          receipt=json.loads(Path('candidate462/receipt.json').read_text())
          assert receipt['source']==source
          verified=list(Path('native-receipts').rglob('native-verification.json'))
          assert len(verified)==6,len(verified)
          expected={(variant,case) for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          seen=set()
          for p in verified:
              d=json.loads(p.read_text())
              assert d['source']==source and d['build']==462 and d['tests']==1
              assert d['device_transfer_complete'] and d['screenshots']
              seen.add((d['variant'],d['case']))
          assert seen==expected,(seen,expected)
          for key,info in receipt['files'].items():
              name='APD-'+key+'-462.apk' if key in ('Developer','Alpha-Testers') else key
              f=Path('candidate462')/name
              assert f.stat().st_size==info['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Exact frozen source, original signed APKs and six complete native visual test receipts verified')
          PY
          if gh release view apd-462 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing APD462 release" >&2
            exit 1
          fi
      - name: Publish only qualified original-signer APKs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create apd-462 candidate462/APD-Developer-462.apk candidate462/APD-Alpha-Testers-462.apk candidate462/APD-Source-462.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'APD462: movement-only speed and character-select UI fix' --notes 'Only character walking speed follows selected 0.5x–1000x playback. All other visual effects, attacks, particles, alerts, gas, wells, status and environment are 1x. Includes previously merged fixes plus character-selection difficulty fade. Signed using the original APD identity. Source tests, Android/desktop compilation, original signer/package checks and six frozen APK native visual regressions are required before publishing. Physical RedMagic installation remains unverified.' --prerelease --latest=false
      - name: Read back published assets and check byte-for-byte hashes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p readback
          gh release download apd-462 --repo "$GITHUB_REPOSITORY" --dir readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          receipt=json.loads(pathlib.Path('candidate462/receipt.json').read_text())
          for key,info in receipt['files'].items():
              if key=='APD-Instrumentation-462.apk':continue
              name='APD-'+key+'-462.apk' if key in ('Developer','Alpha-Testers') else key
              f=pathlib.Path('readback')/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Published APKs and corresponding source read back and matched original frozen bytes')
          PY
