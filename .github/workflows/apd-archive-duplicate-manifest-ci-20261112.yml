name: Verify APD archive duplicate manifest refusal
on:
  push:
    branches: [chatgpt/apd-archive-duplicate-manifest-20261112-1430]
    paths: [.github/workflows/apd-archive-duplicate-manifest-ci-20261112.yml]
permissions: {contents: read}
concurrency:
  group: apd-archive-duplicate-manifest-source-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact archive identity guard and new regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          t=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestTest.java').read_text()
          h=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveHostileTest.java').read_text()
          assert 'if (!filePaths.add(e.path)) throw new IllegalArgumentException(' in s
          assert 'checksummedDuplicatePathsAreRejectedRatherThanSilentlyCountedTwice' in t
          assert 'duplicateChecksummedManifestPathsRefuseEntireImportBeforeDiskMutation' in h
          print('Guard and both named archive regressions are present')
          PY
      - name: Full core tests and desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean complete JUnit results and both exact tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots,'missing core JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3306,totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={c.get('name') for r in roots for c in r.findall('testcase')}
          expected={'checksummedDuplicatePathsAreRejectedRatherThanSilentlyCountedTwice','duplicateChecksummedManifestPathsRefuseEntireImportBeforeDiskMutation'}
          assert expected<=cases,expected-cases
          print('Verified new regressions and full suite',totals,'suites',len(roots))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-duplicate-manifest-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
