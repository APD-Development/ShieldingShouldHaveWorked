name: APD463 exact frozen APK Alpha WallGeometry recovery and release
on:
  push:
    branches: [chatgpt/apd463-character-animations-integrated-20261112]
    paths: [.github/workflows/apd463-wall-recovery-publish.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd463-exact-candidate-and-delivery, cancel-in-progress: false}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Alpha-Testers
            case: WallGeometryDeviceTest
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Obtain only original frozen candidate bytes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p candidate463
          gh run download 43317931038 --repo "$GITHUB_REPOSITORY" --name apd463-frozen-candidate --dir candidate463
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path('candidate463'); receipt=json.loads((d/'receipt.json').read_text())
          assert receipt['source']=='6d901f2886d6060056d9aaddf63aa1f81536c079' and receipt['build']==463
          for key,info in receipt['files'].items():
              name='APD-'+key+'-463.apk' if key in ('Developer','Alpha-Testers') else key
              f=d/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact original Developer/Alpha APK on Android with native visual receipts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p native463
            adb install -r candidate463/APD-${{ matrix.variant }}-463.apk
            adb install -r candidate463/APD-Instrumentation-463.apk
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.${{ matrix.case }}' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native463/instrumentation.txt 2>&1
            cat native463/instrumentation.txt
            python3 tools/apd463_native_postcheck.py --variant '${{ matrix.variant }}' --case '${{ matrix.case }}' --directory native463 --source 6d901f2886d6060056d9aaddf63aa1f81536c079
            adb logcat -d -v time > native463/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd463-native-${{ matrix.variant }}-${{ matrix.case }}
          path: native463/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require exact six accepted native receipts from this build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -e
          mkdir -p candidate463 native-receipts
          gh run download 43317931038 --repo "$GITHUB_REPOSITORY" --name apd463-frozen-candidate --dir candidate463
          gh run download 43317931038 --repo "$GITHUB_REPOSITORY" --pattern 'apd463-native-*' --dir previous-native
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'apd463-native-*' --dir native-receipts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          source='6d901f2886d6060056d9aaddf63aa1f81536c079'
          receipt=json.loads(Path('candidate463/receipt.json').read_text())
          assert receipt['source']==source
          previous=list(Path('previous-native').rglob('native-verification.json'))
          recovered=list(Path('native-receipts').rglob('native-verification.json'))
          assert len(previous)==5,len(previous)
          assert len(recovered)==1,len(recovered)
          verified=previous+recovered
          expected={(variant,case) for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          seen=set()
          for p in verified:
              d=json.loads(p.read_text())
              assert d['source']==source and d['build']==463 and d['tests']==1
              assert d['device_transfer_complete'] and d['screenshots']
              seen.add((d['variant'],d['case']))
          assert seen==expected,(seen,expected)
          for key,info in receipt['files'].items():
              name='APD-'+key+'-463.apk' if key in ('Developer','Alpha-Testers') else key
              f=Path('candidate463')/name
              assert f.stat().st_size==info['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Exact frozen source, original signed APKs and six complete native visual test receipts verified')
          PY
          if gh release view apd-463 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing APD463 release" >&2
            exit 1
          fi
      - name: Publish only qualified original-signer APKs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create apd-463 candidate463/APD-Developer-463.apk candidate463/APD-Alpha-Testers-463.apk candidate463/APD-Source-463.zip --repo "$GITHUB_REPOSITORY" --target 6d901f2886d6060056d9aaddf63aa1f81536c079 --title 'APD463: character animations and approved APD fixes' --notes 'Player and enemy character frames and walking follow selected 0.5x–1000x playback. Environmental animations, wells, gas, alerts and UI remain 1x. Includes approved APD search and history corrections, original signer and native checks. Signed using the original APD identity. Source tests, Android/desktop compilation, original signer/package checks and six frozen APK native visual regressions are required before publishing. Physical RedMagic installation remains unverified.' --prerelease --latest=false
      - name: Read back published assets and check byte-for-byte hashes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p readback
          gh release download apd-463 --repo "$GITHUB_REPOSITORY" --dir readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          receipt=json.loads(pathlib.Path('candidate463/receipt.json').read_text())
          for key,info in receipt['files'].items():
              if key=='APD-Instrumentation-463.apk':continue
              name='APD-'+key+'-463.apk' if key in ('Developer','Alpha-Testers') else key
              f=pathlib.Path('readback')/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Published APKs and corresponding source read back and matched original frozen bytes')
          PY
