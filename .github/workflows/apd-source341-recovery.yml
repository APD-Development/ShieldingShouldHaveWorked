name: APD TEST341 matching source recovery and player reconstruction
on:
  push:
    branches: [codex/gplv3-compliance-2026-11-01]
    paths: [docs/compliance/source341-recovery-request.txt]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch checksum-pinned existing APKs and package source without signing credentials
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p original source
          gh release download apd-alpha-preview-341 --repo "$GITHUB_REPOSITORY" --pattern APD-Developer-341.apk --pattern APD-Alpha-Testers-341.apk --dir original
          python3 tools/apd_corresponding_source.py --apk original/APD-Developer-341.apk --variant Developer --output source/APD-Source-341-Developer.zip
          python3 tools/apd_corresponding_source.py --apk original/APD-Alpha-Testers-341.apk --variant Alpha-Testers --output source/APD-Source-341-Alpha-Testers.zip
          python3 tools/apd_publish_source_archive.py source/APD-Source-341-Developer.zip source/APD-Source-341-Alpha-Testers.zip
      - name: Supply historical corresponding source beside existing private binaries
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_publish_source_archive.py source/APD-Source-341-Developer.zip source/APD-Source-341-Alpha-Testers.zip --publish
      - name: Reconstruct one unsigned player APK, no signing or binary publication
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          unzip -q source/APD-Source-341-Alpha-Testers.zip -d reconstructed
          cd reconstructed/APD-Source-341-Alpha-Testers
          chmod +x gradlew
          ./gradlew :android:assembleDebug -PapdUnsignedVerification -PapdBuild=P341
      - name: Compare every application entry, including DEX and all runtime assets
        run: python3 tools/apd_compare_apk_payload.py original/APD-Alpha-Testers-341.apk reconstructed/APD-Source-341-Alpha-Testers/android/build/outputs/apk/debug/android-debug-unsigned.apk --report source/player-reconstruction.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-source341-recovery-evidence
          path: source/
          retention-days: 30
