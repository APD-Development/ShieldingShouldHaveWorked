name: APD C484 P484 original-signer buffered-history candidate build
on:
  push:
    branches: [chatgpt/apd-buffered-c484p484-20261116-0943]
    paths: [.github/workflows/apd-buffered-c484p484-20261116.yml]
permissions: {contents: read}
concurrency: {group: apd-buffered-c484p484-20261116, cancel-in-progress: false}
jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require exact CI-passed production source and isolated workflow only
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 81eca3ffd14ed3ecffc17aaf5d31e45dbacb7e91 HEAD
          test "$(git diff --name-only 81eca3ffd14ed3ecffc17aaf5d31e45dbacb7e91 HEAD)" = ".github/workflows/apd-buffered-c484p484-20261116.yml"
          test "$(git rev-parse 81eca3ffd14ed3ecffc17aaf5d31e45dbacb7e91^{tree})" = "ff8516c9faf20e1a3f349e8a7a387bd291755f8e"
          echo "Exact CI-passed production tree preserved; only separate build workflow added."
      - name: Assemble original-signed Developer C484 and Alpha P484
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p deliverable
          ./gradlew :android:assembleDebug -PapdTestBuild -PapdBuild=C484 --no-daemon
          cp android/build/outputs/apk/debug/android-debug.apk deliverable/APD-Developer-BufferedHistory-C484.apk
          ./gradlew :android:assembleDebug -PapdBuild=P484 --no-daemon
          cp android/build/outputs/apk/debug/android-debug.apk deliverable/APD-Alpha-Testers-BufferedHistory-P484.apk
          git archive --format=zip --output=deliverable/APD-Source-BufferedHistory-C484-P484.zip 81eca3ffd14ed3ecffc17aaf5d31e45dbacb7e91
      - name: Verify original signer, application identity, version, edition flags and hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,zipfile
          tools=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1].parent
          expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          receipt={'production_source_sha':'81eca3ffd14ed3ecffc17aaf5d31e45dbacb7e91',
                   'source_tree':'ff8516c9faf20e1a3f349e8a7a387bd291755f8e',
                   'source_ci_run':43888061327,'source_ci_tests':3529,
                   'build_workflow_sha':os.environ['GITHUB_SHA'],'versionCode':920,
                   'signer_sha256':expected,'native_android_accepted':False,
                   'install_over_save_verified':False,'published':False,'variants':{}}
          for variant,name,marker in (
              ('Developer','APD-Developer-BufferedHistory-C484.apk','-bC484-TEST'),
              ('Alpha Testers','APD-Alpha-Testers-BufferedHistory-P484.apk','-bP484')):
              p=pathlib.Path('deliverable')/name
              assert p.is_file() and p.stat().st_size>30000000
              out=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(p)],text=True)
              match=re.search(r'SHA-256 digest:\s*([0-9a-fA-F:]+)',out)
              assert match,out
              assert match.group(1).replace(':','').lower()==expected
              badge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(p)],text=True)
              package=next(x for x in badge.splitlines() if x.startswith('package:'))
              assert "name='com.charltonchris29.adhdpixeldungeon.indev'" in package,package
              assert "versionCode='920'" in package,package
              assert marker in package,package
              with zipfile.ZipFile(p) as z:
                  flags=z.read('assets/apd/features.txt').decode('utf-8').strip().splitlines()
              assert flags==(['testBuild','grudge','demoUnlock','clericPlayable'] if variant=='Developer'
                             else ['extendedPlayback','grudge']),flags
              receipt['variants'][variant]={'name':name,'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'package':package,'flags':flags}
          src=pathlib.Path('deliverable/APD-Source-BufferedHistory-C484-P484.zip')
          receipt['source_zip_sha256']=hashlib.sha256(src.read_bytes()).hexdigest()
          pathlib.Path('deliverable/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          sha256sum deliverable/*.apk deliverable/*.zip > deliverable/sha256sums.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apd-buffered-history-original-signed-c484-p484
          path: deliverable/
          retention-days: 30
          if-no-files-found: error
