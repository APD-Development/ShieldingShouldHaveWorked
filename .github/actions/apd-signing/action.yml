name: Restore existing external APD signing identity
description: Never generate a replacement key or commit signing material
inputs:
  keystore-base64:
    required: true
  store-password:
    required: true
  key-password:
    required: false
  key-alias:
    required: false
    default: apd
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APD_SIGNING_KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        APD_SIGNING_STORE_PASSWORD: ${{ inputs.store-password }}
        APD_SIGNING_KEY_PASSWORD: ${{ inputs.key-password }}
        APD_SIGNING_KEY_ALIAS: ${{ inputs.key-alias }}
      run: python3 tools/apd_prepare_signing.py
